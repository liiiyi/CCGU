name: CPU smoke

on:
  push:
  pull_request:

jobs:
  unlearning-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install numpy==1.24.4
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile main.py parameter_parser.py exp/unlearning_core.py exp/exp_unlearn.py
