name: CPU smoke

on:
  push:
  pull_request:

jobs:
  unlearning-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      # The CPU suite covers the community bookkeeping, the mapping rules
      # (Equations 8/9/11) and the CCP community detection.  None of that needs
      # torch or DGL: tests/fake_graph.py provides a DGL-shaped stub.
      - run: >
          python -m pip install
          numpy==1.24.4 scipy==1.10.1 scikit-learn==1.3.2 networkx==3.1
      - run: python -m unittest discover -s tests -v
      - run: >
          python -m py_compile
          main.py parameter_parser.py config.py
          exp/unlearning_core.py exp/methods/CCP.py
          exp/methods/partition_diagnostics.py
          lib_utils/stats.py lib_utils/splits.py
          reproduction/scripts/run_experiment.py
          reproduction/scripts/run_grid.py
          reproduction/scripts/make_tables.py
          reproduction/scripts/audit_partition.py
          reproduction/scripts/report_env.py
      - run: bash -n reproduction/scripts/setup_env.sh reproduction/scripts/run_all.sh
